apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          # 1) one entry per folder under services/  ->  {{.path.basename}} = hello-api
          - git:
              repoURL: https://github.com/unnamedid/platform-gitops.git
              revision: main
              directories:
                - path: services/*
          - clusters:
              selector:
                matchExpressions:
                  - key: env
                    operator: In
                    values: ["dev", "prod"]
  template:
    metadata:
      name: '{{.path.basename}}-{{.name}}'
    spec:
      project: 'apps-{{.metadata.labels.env}}'
      sources:
        - repoURL: https://github.com/unnamedid/platform-gitops.git
          targetRevision: main
          path: charts/app
          helm:
            valueFiles:
              - '$values/{{.path.path}}/values.yaml'
              - '$values/{{.path.path}}/values-{{.metadata.labels.env}}.yaml'
        - repoURL: https://github.com/unnamedid/platform-gitops.git
          targetRevision: main
          ref: values
      destination:
        name: '{{.name}}'
        namespace: '{{.path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
