# SCAFFOLD: intentionally insecure (chapter 08). Replace the cluster-admin binding with least privilege.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-manager
  namespace: kube-system
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-manager-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: argocd-manager
type: kubernetes.io/service-account-token
---
# TODO(ch08): this hands the hub cluster-admin on the spoke. Argo CD only needs to manage workloads in
# the namespaces listed in namespaces.yaml. Replace this binding with a Role + RoleBinding per namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: argocd-manager
    namespace: kube-system
